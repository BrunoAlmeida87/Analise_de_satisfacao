<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avaliação de Reação dos Treinamentos</title>
<meta name="description" content="Dashboard das fichas de avaliação de reação dos treinamentos: satisfação por pergunta, aprendizagem percebida, diagnóstico por curso e turma, participação e qualidade da base.">
<style>
:root {
  color-scheme: light dark;
  --font-anthropic-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-anthropic-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --color-bg: #f6f5f1; --color-panel: #ffffff; --color-fg: #1c1c1a; --color-fg-muted: #6b6963; --color-border-line: #e3e1da;
  --color-ok: #1b7a5c; --color-warn: #a86400; --color-bad: #c03d2a;
  --sv-c2: #3d6fb4; --sv-c3: #b0712a; --sv-c4: #7a5bb0; --sv-c5: #2f8f9d; --sv-c6: #b04a7a; --sv-c7: #6b8a2a; --sv-c8: #8a6b4a;
  --cds-font-size-caption: 12px; --cds-font-size-body: 14px; --cds-font-size-heading: 16px; --cds-font-size-title: 22px; --cds-font-weight-medium: 600;
  --cds-gap-xs: 4px; --cds-gap-sm: 8px; --cds-gap-md: 16px; --cds-gap-lg: 24px; --cds-gap-xl: 32px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 20px; --cds-radius: 10px;
  --cds-chart-grid: rgba(28,28,26,.08); --cds-chart-axis: rgba(28,28,26,.28); --cds-chart-reference: rgba(28,28,26,.38);
  --cds-surface-popover: #ffffff; --cds-border: #dcdad3; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.12); --cds-text-secondary: #6b6963;
  --cds-dur-slow: 420ms; --cds-ease-out: cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --color-bg: #151514; --color-panel: #1e1e1c; --color-fg: #ecebe5; --color-fg-muted: #9e9c94; --color-border-line: #33322e;
  --color-ok: #4cbf95; --color-warn: #e3a144; --color-bad: #ef6a52;
  --cds-chart-grid: rgba(236,235,229,.08); --cds-chart-axis: rgba(236,235,229,.28); --cds-chart-reference: rgba(236,235,229,.4);
  --cds-surface-popover: #262624; --cds-border: #3a3935; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.5); --cds-text-secondary: #9e9c94;
} }
:root[data-theme="dark"] {
  --color-bg: #151514; --color-panel: #1e1e1c; --color-fg: #ecebe5; --color-fg-muted: #9e9c94; --color-border-line: #33322e;
  --color-ok: #4cbf95; --color-warn: #e3a144; --color-bad: #ef6a52;
  --cds-chart-grid: rgba(236,235,229,.08); --cds-chart-axis: rgba(236,235,229,.28); --cds-chart-reference: rgba(236,235,229,.4);
  --cds-surface-popover: #262624; --cds-border: #3a3935; --cds-shadow-popover: 0 6px 24px rgba(0,0,0,.5); --cds-text-secondary: #9e9c94;
}
html, body { margin: 0; background: var(--color-bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); -webkit-font-smoothing: antialiased; }
#dash-root { --dash-gutter: 16px; padding: 28px var(--dash-gutter) 48px; }
.dash-skeleton { }
.sv-theme { position: absolute; top: 20px; right: max(16px, calc((100vw - 1320px) / 2)); }

</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
<div id="dash-root">
<style>
#dash-root { --dash-gutter: clamp(12px, 2vw, 28px); }
.sv { max-width: 1760px; margin-inline: auto; font-family: var(--font-anthropic-sans); color: var(--color-fg); position: relative;
  --sv-accent: var(--color-ok);
  --sv-n1: var(--color-bad);
  --sv-n2: color-mix(in srgb, var(--color-bad) 45%, var(--color-panel));
  --sv-n3: color-mix(in srgb, var(--color-fg-muted) 30%, var(--color-panel));
  --sv-n4: color-mix(in srgb, var(--sv-accent) 45%, var(--color-panel));
  --sv-n5: var(--sv-accent);
  --sv-h1: var(--color-bad); --sv-h2: var(--color-warn); --sv-h3: color-mix(in srgb, var(--sv-accent) 40%, var(--color-panel)); --sv-h4: var(--sv-accent);
}
.sv * { box-sizing: border-box; }
.sv .sv-num, .sv table { font-variant-numeric: tabular-nums; }
.sv b, .sv strong { font-weight: var(--cds-font-weight-medium); }
.sv-eyebrow { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); letter-spacing: .08em; text-transform: uppercase; display: flex; flex-wrap: wrap; gap: 6px 10px; }
.sv-title { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: clamp(2rem, 4vw, 2.9rem); line-height: 1.06; margin: var(--cds-gap-sm) 0 var(--cds-gap-md); letter-spacing: -.01em; }
.sv-take { font-size: var(--cds-font-size-heading); line-height: 1.55; color: var(--color-fg-muted); max-width: 80ch; margin: 0; min-height: 3.1em; }
.sv-take b { color: var(--color-fg); }
.sv-good { color: var(--sv-accent) !important; }
.sv-bad { color: var(--color-bad) !important; }
.sv-topbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--cds-gap-sm); align-items: center; margin-bottom: var(--cds-gap-md); }
.sv-actions { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; }

/* sticky bar: filters + section nav */
.sv-sticky { position: sticky; top: 0; z-index: 8; background: var(--color-bg); margin: var(--cds-gap-lg) 0 0; border-bottom: 1px solid var(--color-border-line); }
.sv-filters { padding: var(--cds-pad-sm) 0 6px; display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm) var(--cds-gap-md); align-items: flex-end; }
.sv-f { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.sv-f label, .sv-f > span { font-size: 11px; color: var(--color-fg-muted); letter-spacing: .06em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 4px; }
.sv-f select { font: inherit; font-size: var(--cds-font-size-body); color: var(--color-fg); background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 6px 28px 6px 10px; max-width: 100%; }
.sv-f-curso select { width: min(26rem, 82vw); }
.sv-btn { font: inherit; font-size: var(--cds-font-size-caption); color: var(--color-fg); background: transparent; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 6px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sv-btn:hover { background: var(--color-panel); }
.sv-btn[aria-expanded=true] { background: var(--color-fg); color: var(--color-bg); }
.sv-btn svg { width: 13px; height: 13px; flex: none; }
.sv-scope { margin-left: auto; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); text-align: right; line-height: 1.4; max-width: 100%; }
.sv-scope b { color: var(--color-fg); font-size: var(--cds-font-size-body); display: block; }
.sv-seg { display: inline-flex; border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); overflow: hidden; }
.sv-seg button { font: inherit; font-size: var(--cds-font-size-caption); border: 0; background: transparent; color: var(--color-fg-muted); padding: 5px 10px; cursor: pointer; }
.sv-seg button[aria-pressed=true] { background: var(--color-fg); color: var(--color-bg); }
.sv-nav { display: flex; gap: 2px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }
.sv-nav::-webkit-scrollbar { display: none; }
.sv-nav a { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); text-decoration: none; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.sv-nav a:hover { color: var(--color-fg); background: var(--color-panel); }
.sv-nav a.sv-on { color: var(--color-fg); background: var(--color-panel); box-shadow: inset 0 0 0 1px var(--color-border-line); }

/* info tips */
.sv-i { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--color-border-line); background: transparent; color: var(--color-fg-muted); font: italic 600 10px/1 Georgia, serif; cursor: help; padding: 0; vertical-align: middle; flex: none; text-transform: none; letter-spacing: 0; }
.sv-i:hover, .sv-i:focus-visible { color: var(--color-fg); border-color: var(--color-fg-muted); }
.sv-pop { position: absolute; z-index: 30; max-width: 320px; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-sm) var(--cds-pad-md); font-size: var(--cds-font-size-caption); line-height: 1.5; color: var(--color-fg); pointer-events: none; opacity: 0; transition: opacity .12s; text-transform: none; letter-spacing: 0; font-weight: 400; text-align: left; white-space: normal; }
.sv-pop b { display: block; margin-bottom: 2px; }

/* panels: colors, upload, preview */
.sv-panel { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); margin: var(--cds-gap-md) 0 0; }
.sv-panel[hidden] { display: none; }
.sv-cfg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr)); gap: var(--cds-gap-lg); margin-top: var(--cds-gap-md); }
.sv-cfg-grid h4 { margin: 0 0 var(--cds-gap-sm); font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); }
.sv-swatches { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm) var(--cds-gap-md); }
.sv-sw { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; font-size: 11px; color: var(--color-fg-muted); }
.sv-sw input[type=color] { width: 44px; height: 30px; border: 1px solid var(--color-border-line); border-radius: 6px; padding: 2px; background: var(--color-bg); cursor: pointer; }
.sv-thr { display: grid; grid-template-columns: auto repeat(3, minmax(0, 5.2rem)); gap: 6px 8px; align-items: center; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-top: var(--cds-gap-sm); }
.sv-thr input { font: inherit; font-size: var(--cds-font-size-caption); width: 100%; padding: 4px 6px; border: 1px solid var(--color-border-line); border-radius: 6px; background: var(--color-bg); color: var(--color-fg); }
.sv-rscale { display: inline-flex; align-items: center; gap: 6px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.sv-rscale input { font: inherit; font-size: var(--cds-font-size-caption); width: 4.4rem; padding: 4px 6px; border: 1px solid var(--color-border-line); border-radius: 6px; background: var(--color-bg); color: var(--color-fg); }
.sv-radar-wrap { max-width: 760px; margin-inline: auto; }
.sv-thr span.sv-thr-h { display: flex; align-items: center; gap: 4px; }
.sv-thr span.sv-thr-h i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sv-prev-strip { display: flex; gap: 4px; margin-top: var(--cds-gap-sm); flex-wrap: wrap; }
.sv-prev-strip span { font-size: var(--cds-font-size-caption); padding: 6px 10px; border-radius: 5px; min-width: 3.4rem; text-align: center; }
.sv-panel-foot { display: flex; justify-content: space-between; align-items: center; gap: var(--cds-gap-sm); margin-top: var(--cds-gap-lg); flex-wrap: wrap; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }
.sv-panel-head { display: flex; justify-content: space-between; gap: var(--cds-gap-md); align-items: flex-start; flex-wrap: wrap; }
.sv-panel-head h3 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
.sv-panel-head p { margin: 4px 0 0; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); max-width: 70ch; line-height: 1.5; }
.sv-upmsg { font-size: var(--cds-font-size-caption); margin-top: var(--cds-gap-sm); min-height: 1.2em; }

/* layout */
.sv-section { margin-top: var(--cds-gap-xl); scroll-margin-top: 170px; }
.sv-sec-head { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--cds-gap-md); flex-wrap: wrap; margin-bottom: var(--cds-gap-md); }
.sv-h2 { font-size: var(--cds-font-size-title); font-family: var(--font-anthropic-serif); font-weight: 400; margin: 0 0 4px; }
.sv-h2-note { color: var(--color-fg-muted); font-size: var(--cds-font-size-body); margin: 0; max-width: 80ch; line-height: 1.5; }
.sv-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr)); }
.sv-grid-21 { display: grid; gap: 12px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 900px) { .sv-grid-21 { grid-template-columns: minmax(0, 1fr); } }
.sv-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: 16px; position: relative; min-width: 0; }
.sv-card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: var(--cds-gap-sm) var(--cds-gap-md); margin-bottom: var(--cds-gap-md); }
.sv-card-head > div:first-child { flex: 1 1 16rem; min-width: 0; }
.sv-card-title { font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); margin: 0; display: flex; align-items: center; gap: 6px; }
.sv-card-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin: 4px 0 0; line-height: 1.5; max-width: 76ch; }
.sv-tools { display: flex; gap: var(--cds-gap-sm); align-items: center; flex-wrap: wrap; flex: 0 1 auto; max-width: 100%; }

/* KPIs */
.sv-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 13.5rem), 1fr)); gap: 12px; padding: 2px; }
.sv-kpi { display: flex; flex-direction: column; gap: 10px; min-height: 12.5rem; }
.sv-kpi-label { font-size: 11px; color: var(--color-fg-muted); text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 6px; }
.sv-kpi-val { font-family: var(--font-anthropic-serif); font-weight: 400; font-size: clamp(2.3rem, 3.6vw, 3rem); line-height: 1; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sv-kpi-val small { font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); color: var(--color-fg-muted); margin-left: 4px; }
.sv-kpi-note { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); line-height: 1.45; margin-top: auto; }
.sv-delta { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); min-height: 1.2em; }
.sv-pips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; height: 10px; }
.sv-pip { background: var(--sv-n3); border-radius: 3px; overflow: hidden; position: relative; height: 10px; }
.sv-pip > i { position: absolute; inset: 0 auto 0 0; background: var(--sv-accent); border-radius: 3px; }
.sv-stack { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; }
.sv-stack > span { display: block; height: 100%; min-width: 0; }
.sv-ring-row { display: flex; align-items: center; gap: var(--cds-gap-md); }

/* charts */
.sv-chart { position: relative; }
.sv-chart svg { display: block; overflow: visible; }
.sv-chart svg text { font-family: var(--font-anthropic-sans); }
.sv-tip { position: absolute; pointer-events: none; background: var(--cds-surface-popover); border: 1px solid var(--cds-border); border-radius: var(--cds-radius); box-shadow: var(--cds-shadow-popover); padding: var(--cds-pad-xs) var(--cds-pad-sm); font-size: var(--cds-font-size-caption); white-space: nowrap; opacity: 0; transition: opacity .12s; z-index: 5; line-height: 1.5; }
.sv-tip .sv-tip-h { color: var(--cds-text-secondary); margin-bottom: 2px; max-width: 320px; white-space: normal; }
.sv-tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.sv-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); margin-bottom: var(--cds-gap-md); align-items: center; }
.sv-legend span { display: inline-flex; align-items: center; gap: 6px; }
.sv-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.sv-legend .sv-lg-line { width: 2px; height: 14px; border-radius: 1px; background: var(--color-fg); }
.sv-empty { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); padding: var(--cds-pad-md) 0; }

/* dims */
.sv-dims { display: flex; flex-direction: column; gap: var(--cds-gap-lg); }
.sv-dim-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sv-dim-name { font-size: var(--cds-font-size-body); font-weight: var(--cds-font-weight-medium); }
.sv-dim-val { font-family: var(--font-anthropic-serif); font-size: 1.9rem; line-height: 1; }
.sv-dim-bar { height: 8px; border-radius: 4px; background: var(--sv-n3); margin: 8px 0 6px; position: relative; overflow: visible; }
.sv-dim-bar > i { position: absolute; inset: 0 auto 0 0; background: var(--sv-accent); border-radius: 4px; height: 8px; }
.sv-dim-bar > em { position: absolute; top: -4px; bottom: -4px; width: 2px; height: 16px; background: var(--color-fg); border-radius: 1px; }
.sv-dim-sub { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); display: flex; justify-content: space-between; gap: 8px; }

/* knowledge */
.sv-know { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xl); align-items: flex-start; }
.sv-know-mat { flex: 1 1 22rem; min-width: 0; position: relative; }
.sv-know-side { flex: 1 1 18rem; display: flex; flex-direction: column; gap: var(--cds-gap-lg); min-width: 0; }
.sv-big { font-family: var(--font-anthropic-serif); font-size: clamp(2rem, 3.4vw, 2.7rem); line-height: 1; white-space: nowrap; }
.sv-big .sv-arrow { color: var(--color-fg-muted); font-size: .7em; margin: 0 .25em; }
.sv-mini-lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--color-fg-muted); margin-bottom: 6px; }
.sv-dist-row { display: grid; grid-template-columns: 3.6rem minmax(0, 1fr) 3rem; gap: 10px; align-items: center; font-size: var(--cds-font-size-caption); margin-bottom: 6px; }
.sv-dist-row .sv-stack { height: 18px; border-radius: 4px; }
.sv-tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--cds-gap-sm); }
.sv-tri div { border-top: 3px solid var(--sv-n3); padding-top: 6px; }
.sv-tri b { display: block; font-size: 1.25rem; font-family: var(--font-anthropic-serif); font-weight: 400; }
.sv-tri span { font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); }

/* lists */
.sv-scroll { max-height: 520px; overflow: auto; }
.sv-part-row { display: grid; grid-template-columns: minmax(0, 15rem) minmax(0, 1fr) 4.2rem; gap: 12px; align-items: center; padding: 6px 2px; border-bottom: 1px solid var(--cds-chart-grid); font-size: var(--cds-font-size-caption); cursor: pointer; }
.sv-part-row:hover { background: color-mix(in srgb, var(--color-fg) 4%, transparent); }
.sv-part-row.sv-cur { background: color-mix(in srgb, var(--sv-accent) 10%, transparent); }
.sv-part-row .sv-stack { height: 16px; border-radius: 3px; gap: 1px; }
.sv-part-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-part-name small { color: var(--color-fg-muted); margin-left: 6px; }
.sv-part-rate { text-align: right; font-weight: var(--cds-font-weight-medium); }
@media (max-width: 560px) { .sv-part-row { grid-template-columns: minmax(0, 1fr) 3.6rem; } .sv-part-row .sv-stack { grid-column: 1 / -1; order: 3; } }

/* tables */
.sv-tbl { border-collapse: collapse; width: 100%; font-size: var(--cds-font-size-caption); }
.sv-tbl th { position: sticky; top: 0; background: var(--color-panel); z-index: 1; text-align: left; font-weight: var(--cds-font-weight-medium); color: var(--color-fg-muted); padding: 8px 8px; border-bottom: 1px solid var(--color-border-line); white-space: nowrap; vertical-align: bottom; }
.sv-tbl th .sv-th { display: inline-flex; gap: 4px; align-items: center; }
.sv-tbl th button.sv-sort { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.sv-tbl th[aria-sort] button.sv-sort { color: var(--color-fg); }
.sv-tbl td { padding: 8px; border-bottom: 1px solid var(--cds-chart-grid); vertical-align: middle; }
.sv-tbl tbody tr { cursor: pointer; }
.sv-tbl tbody tr:hover td { background: color-mix(in srgb, var(--color-fg) 4%, transparent); }
.sv-tbl tr.sv-cur td { background: color-mix(in srgb, var(--sv-accent) 10%, transparent); }
.sv-tbl .r { text-align: right; }
.sv-tbl th.r .sv-th { justify-content: flex-end; }
.sv-cell-name { max-width: 22rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sv-cell-name small { display: block; color: var(--color-fg-muted); font-size: 11px; }

      else cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    const head = rows.shift();
    return { columns: head, data: rows.filter((r) => r.length === head.length).map((r) => Object.fromEntries(head.map((h, i) => [h, r[i]]))) };

  const DS = { ...ORIG };
  const CALCS = [];
  let info = { kind: 'orig' };
  try {
    const saved = JSON.parse(localStorage.getItem('sv-base') || 'null');
    if (saved && saved.rel && saved.cur) {
      const toDS = (a) => ({ columns: a[0], data: a.slice(1).map((r) => Object.fromEntries(a[0].map((h, i) => [h, r[i] ?? '']))) });
      DS.relatorios = toDS(saved.rel); DS.cursos = toDS(saved.cur);
      info = { kind: 'user', file: saved.file, at: saved.at };

  const DEFAULTS = { areas: [], cursos: [], turmas: [], onlyFilled: false, grp: 'auto', minN: 5, metrica: 'media', ordem: 'form', rmetric: 'media', rscale: 'full', rmin: 3, rmax: 5, pmin: 40, pmax: 100 };

  const LISTS = ['areas', 'cursos', 'turmas'];
  let params = { ...DEFAULTS };
  try { const h = new URLSearchParams(location.hash.slice(1)); for (const [k, v] of h) if (k in DEFAULTS) params[k] = LISTS.includes(k) ? v.split(',').filter(Boolean) : NUMS.includes(k) ? Number(v) : k === 'onlyFilled' ? v === 'true' : v; } catch (e) { /* ignore */ }
  const subs = [];
  let pending = false;
  const run = () => { pending = false; subs.forEach((fn) => { try { fn(); } catch (e) { console.error(e); } }); };
  const schedule = () => { if (!pending) { pending = true; requestAnimationFrame(run); } };
  const syncHash = () => { const h = new URLSearchParams(); Object.keys(DEFAULTS).forEach((k) => { const v = params[k]; if (LISTS.includes(k)) { if (Array.isArray(v) && v.length) h.set(k, v.join(',')); } else if (v != null && v !== DEFAULTS[k]) h.set(k, v); }); try { history.replaceState(null, '', h.toString() ? '#' + h.toString() : location.pathname + location.search); } catch (e) { /* file:// may block */ } };
  const runCalc = ({ id, inputs, fn }) => { const out = fn(...inputs.map((i) => DS[i].data)); DS[id] = { data: out, columns: out.length ? Object.keys(out[0]) : [] }; };
  window.dash = {
    colors: ['var(--color-ok)'],
    data: (id) => (DS[id] ? { status: 'ok', data: DS[id].data, columns: DS[id].columns, refreshing: false, meta: [] } : { status: 'missing', data: [], columns: [], meta: [] }),

    loader: () => {},
    onData: (fn) => { subs.push(fn); try { fn(); } catch (e) { console.error(e); } },

  window.SV_SET_BASE = ({ relatorios, cursos }, file) => {

    DS.cursos = { data: cursos, columns: Object.keys(cursos[0] || {}) };

    DS.relatorios = ORIG.relatorios; DS.cursos = ORIG.cursos; info = { kind: 'orig' };

  window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - w) > 4) { w = window.innerWidth; schedule(); } });

// (.xlsx, aba SQL Results, uma linha por pergunta) ou um CSV no mesmo formato, e converte para uma linha por ficha,

(() => {
  const XLSX_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  const ensureXLSX = () => new Promise((res, rej) => {
    if (window.XLSX) return res();
    const emb = document.getElementById('lib-xlsx');
    if (emb) { const s = document.createElement('script'); s.textContent = emb.textContent; document.head.appendChild(s); return window.XLSX ? res() : rej(new Error('leitor de Excel embutido não carregou')); }
    const s = document.createElement('script'); s.src = XLSX_URL; s.onload = () => res(); s.onerror = () => rej(new Error('não foi possível carregar o leitor de Excel (sem internet?). Salve a planilha como CSV e tente de novo.'));
    document.head.appendChild(s);
  });
  const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim().toUpperCase();
  const ITEM = [
    [/^OBJETIVOS/, 'objetivos'], [/^EQUILIBRIO/, 'teoria_pratica'], [/^ADEQUACAO/, 'material'], [/^PONTUALIDADE/, 'pontualidade'],
    [/^INSTALACOES/, 'instalacoes'], [/^APOIO/, 'apoio_adm'], [/^RECURSOS/, 'audiovisuais'], [/^DOMINIO/, 'dominio'],
    [/^CLAREZA/, 'clareza'], [/^CAPACIDADE/, 'duvidas'], [/^ANTES/, 'conhec_antes'], [/^APOS/, 'conhec_apos'],
  ];
  const KEYS = ITEM.map((x) => x[1]);
  const itemKey = (s) => { const n = norm(s); const m = ITEM.find(([re]) => re.test(n)); return m ? m[1] : null; };
  const statusOf = (s) => { const n = norm(s); if (n.includes('FALT')) return 'Faltoso'; if (n.includes('NAO PREENCH')) return 'Não preenchido'; if (n.includes('PREENCH')) return 'Preenchido'; return null; };
  const splitCSV = (txt) => {
    const first = txt.split(/\r?\n/, 1)[0];
    const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;

  // ---------- Funnel (generic) ----------
  const lim = (mu, sd) => ({ lo: (n, z) => mu - (z * sd) / Math.sqrt(n), hi: (n, z) => Math.min(5, mu + (z * sd) / Math.sqrt(n)) });
  function funnel(box, pts, mu, sd, opts) {
    clearChart(box);
    const tip = tipFor(box);
    const W = box.clientWidth; if (!W || !pts.length) return;
    const H = opts.H || 360, m = { t: 14, r: 18, b: 42, l: 46 };
    const svg = d3.select(box).insert('svg', '.sv-tip').attr('width', '100%').attr('height', H).attr('viewBox', `0 0 ${W} ${H}`);
    const nMin = Math.max(1, d3.min(pts, (p) => p.n)), nMax = Math.max(2, d3.max(pts, (p) => p.n));
    const x = d3.scaleLog([Math.max(1, nMin * 0.8), nMax * 1.25], [m.l, W - m.r]);
    const { lo, hi } = lim(mu, sd);
    const yMin = Math.max(1, Math.min(d3.min(pts, (p) => p.v) - 0.05, lo(x.domain()[0], 3.09)));
    const y = d3.scaleLinear([yMin, 5.02], [H - m.b, m.t]);
    const ns = d3.range(0, 101).map((i) => x.domain()[0] * Math.pow(x.domain()[1] / x.domain()[0], i / 100));
    const bandA = (z) => d3.area().x((n) => x(n)).y0((n) => y(Math.max(yMin, lo(n, z)))).y1((n) => y(hi(n, z)));
    svg.append('path').attr('d', bandA(3.09)(ns)).style('fill', 'color-mix(in srgb, var(--color-fg) 5%, transparent)');
    svg.append('path').attr('d', bandA(1.96)(ns)).style('fill', 'color-mix(in srgb, var(--color-fg) 7%, transparent)');
    [1.96, 3.09].forEach((z) => svg.append('path').attr('d', d3.line().x((n) => x(n)).y((n) => y(Math.max(yMin, lo(n, z))))(ns)).style('fill', 'none').style('stroke', 'var(--cds-chart-reference)').style('stroke-width', 1).attr('stroke-dasharray', z > 2 ? '2 3' : null));
    svg.append('line').attr('x1', m.l).attr('x2', W - m.r).attr('y1', y(mu)).attr('y2', y(mu)).style('stroke', 'var(--color-fg-muted)').attr('stroke-dasharray', '4 3');
    svg.append('text').attr('x', m.l + 6).attr('y', y(mu) - 6).style('font-size', 'var(--cds-font-size-caption)').style('fill', 'var(--color-fg-muted)').text(opts.meanLabel);
    const tv = [1, 2, 3, 5, 10, 20, 50, 100, 200, 500, 1000].filter((v) => v >= x.domain()[0] && v <= x.domain()[1]);
    const xa = svg.append('g').attr('transform', `translate(0,${H - m.b})`).call(d3.axisBottom(x).tickValues(tv).tickFormat((v) => fi(v)).tickSizeOuter(0));
    const ya = svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(6).tickFormat((v) => f1(v)).tickSizeOuter(0));

    const wrap = document.createElement('div');

    for (let i = 0; i < scs.length; i++) { const p = scs[i]; if (p.startsWith('--')) vars += p + ':' + scs.getPropertyValue(p) + ';'; }
    wrap.setAttribute('style', vars + `box-sizing:border-box;width:${W + pad * 2}px;padding:${pad}px;background:${bg};font-family:${rcs.fontFamily};color:${rcs.color};`);
    wrap.appendChild(clone);
    const foot = document.createElement('div');
    foot.textContent = `${t('title')} · ${scopeLabel()} · ${t('generated', { d: new Date().toLocaleDateString(LOC()) })}`;
    foot.setAttribute('style', `margin-top:14px;font-size:11px;color:${muted};font-family:${rcs.fontFamily};`);
    wrap.appendChild(foot);
    const host = document.createElement('div');
    host.setAttribute('style', 'position:absolute;left:-200000px;top:0;width:' + (W + pad * 2) + 'px;');
    root.appendChild(host); host.appendChild(wrap);
    const Ht = Math.ceil(wrap.getBoundingClientRect().height) + 14, Wt = W + pad * 2;
    host.remove();
    const scale = Math.max(1, Math.min(maxScale, Math.sqrt(140e6 / (Wt * Ht))));
    const xml = new XMLSerializer().serializeToString(wrap);
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(Wt * scale)}" height="${Math.round(Ht * scale)}" viewBox="0 0 ${Wt} ${Ht}"><foreignObject x="0" y="0" width="${Wt}" height="${Ht}">${xml}</foreignObject></svg>`;
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    await img.decode();
    const c = document.createElement('canvas'); c.width = Math.round(Wt * scale); c.height = Math.round(Ht * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = bg; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    c.svBg = bg; c.svScale = scale;
    return c;
  }
  // ---------- PDF ----------
  const JSPDF_URL = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
  const ensurePDF = () => new Promise((res) => {
    if (window.jspdf) return res(true);
    const emb = document.getElementById('lib-jspdf');
    if (emb) { const s = document.createElement('script'); s.textContent = emb.textContent; document.head.appendChild(s); return res(!!window.jspdf); }
    if (!STANDALONE) return res(false);
    const s = document.createElement('script'); s.src = JSPDF_URL; s.onload = () => res(!!window.jspdf); s.onerror = () => res(false); document.head.appendChild(s);
  });
  function printNodes(nodes) {
    root.classList.add('sv-printing'); nodes.forEach((n) => n.classList.add('sv-print-target'));
    const done = () => { root.classList.remove('sv-printing'); nodes.forEach((n) => n.classList.remove('sv-print-target')); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    try { window.print(); } catch (e) { /* unavailable */ }
    setTimeout(done, 3000);
  }
  async function exportPDF(nodes, fname, anchor) {
    const ok = await ensurePDF();
    if (!ok) { if (nodes.length === 1) printNodes(nodes); else { setView('painel'); try { window.print(); } catch (e) { /* unavailable */ } } return; }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'pt', format: 'a4', compress: true });
    const PW = doc.internal.pageSize.getWidth(), PH = doc.internal.pageSize.getHeight(), M = 24, HEAD = 22;
    let y = M + HEAD, used = false;
    const header = () => { doc.setFontSize(9); doc.setTextColor(110); doc.text(`${t('title')} · ${scopeLabel()} · ${t('generated', { d: new Date().toLocaleDateString(LOC()) })}`, M, M + 8); };
    header();
    for (const node of nodes) {
      if (!node) continue;
      const c = await renderCanvas(node, 2);
      const w = Math.min(PW - 2 * M, (c.width / c.svScale) * 0.75), scale = w / c.width;
      const fullH = c.height * scale, pageH = PH - M - (M + HEAD);
      if (used && fullH <= pageH && fullH > PH - M - y) { doc.addPage(); header(); y = M + HEAD; used = false; }
      let sy = 0;
      while (sy < c.height) {
        const room = PH - M - y;
        if (used && room < Math.min(140, (c.height - sy) * scale)) { doc.addPage(); header(); y = M + HEAD; used = false; continue; }
        const sliceH = Math.min(c.height - sy, Math.floor(room / scale));
        const part = document.createElement('canvas'); part.width = c.width; part.height = sliceH;
        const pctx = part.getContext('2d'); pctx.fillStyle = c.svBg; pctx.fillRect(0, 0, part.width, part.height); pctx.drawImage(c, 0, sy, c.width, sliceH, 0, 0, c.width, sliceH);
        doc.addImage(part.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, w, sliceH * scale, undefined, 'FAST');
        y += sliceH * scale + 8; sy += sliceH; used = true;
        if (sy < c.height) { doc.addPage(); header(); y = M + HEAD; used = false; }
      }
    }
    const n = doc.getNumberOfPages();
    for (let p = 1; p <= n; p++) { doc.setPage(p); doc.setFontSize(8); doc.setTextColor(130); doc.text(t('pdf_page', { p, n }), PW - M, PH - 10, { align: 'right' }); }
    await deliver(doc.output('blob'), fname, anchor, false);
  }
  $('btn-pdf-all').addEventListener('click', async () => {
    const b = $('btn-pdf-all'), lbl = b.querySelector('span'); const old = lbl.textContent;
    lbl.textContent = t('pdf_making'); b.disabled = true;
    const wasDados = UI.view === 'dados'; if (wasDados) setView('painel');
    try { await exportPDF(['cabecalho', 'kpis', 'card-itens', 'card-dims', 'card-radar', 'card-conhecimento', 'card-prioridade', 'card-funil', 'card-turmas', 'card-heat', 'card-ranking', 'card-participacao', 'card-qualidade', 'exec'].map((id) => $(id)), `relatorio_${scopeSlug()}.pdf`, $('cabecalho')); }
    catch (e) { toast(t('failed')); }
    finally { lbl.textContent = old; b.disabled = false; if (wasDados) setView('dados'); }
  });
  function preview(blob, fname, node, isImg) {
    const host = node && node.classList.contains('sv-card') ? node : node ? node.parentElement : root;
    host.querySelectorAll(':scope .sv-preview').forEach((p) => p.remove());
    const url = URL.createObjectURL(blob);
    const box = el('div', 'sv-preview');
    const p = el('p', '', isImg ? t('prev_img') : t('prev_note'));
    const row = el('div');
    const a = el('a', '', t('dl', { f: fname })); a.href = url; a.download = fname;
    const x = el('button', 'sv-btn', t('close')); x.type = 'button'; x.addEventListener('click', () => { box.remove(); URL.revokeObjectURL(url); });
    row.append(a, x); box.append(p);
    if (isImg) { const img = el('img'); img.src = url; img.alt = fname; box.append(img); }
    box.append(row);
    if (node && node.classList.contains('sv-card')) { const head = node.querySelector('.sv-card-head'); if (head) head.after(box); else node.prepend(box); } else if (node) node.before(box); else root.prepend(box);
    try { a.click(); } catch (e) { /* preview stays */ }
  }
  async function deliver(blob, fname, node, isImg) {
    if (DL === undefined) await Promise.race([dlReady, new Promise((r) => setTimeout(r, 1500))]);
    if (DL) { try { await DL.save({ filename: fname, data: blob }); return; } catch (e) { if (e && (e.code === 'declined' || e.code === 'rate_limited')) return; } }
    if (STANDALONE) { const u = URL.createObjectURL(blob); const lk = document.createElement('a'); lk.href = u; lk.download = fname; document.body.appendChild(lk); lk.click(); lk.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); return; }
    preview(blob, fname, node, isImg);
  }

  // ---------- main ----------
  applyColors();
  applyI18n();
  buildCfgPanel();
  setView('painel');
  drawDados();
  let lastLang = null;
  dash.onData(() => {
    applyColors();
    if (lastLang !== UI.lang) { applyI18n(); lastLang = UI.lang; }
    const dR = dash.data('relatorios'), dC = dash.data('cursos');
    const ok = (d) => d.status === 'ok' && Array.isArray(d.data) && d.data.length;
    if (!(ok(dR) && ok(dC))) return;
    const prevDB = DB;
    buildDB(dR.data, dC.data);
    if (prevDB && prevDB !== DB) { D = null; }
    const rows = scopeRows();
    const S = agg(rows), G = DB.G, filt = isFiltered();
    const lvl = level();
    const GR = groups(rows, lvl, F().onlyFilled);
    const scopeSiglas = new Set(rows.map((r) => r.sigla));
    SCOPE = { rows, S };
    $('sv-eyebrow-n').textContent = t('counts', { c: DB.cursos.size, a: new Set([...DB.cursos.values()].map((c) => c.area)).size, t: fi(DB.preByTurma.size) });
    $('sv-scope').replaceChildren(el('b', '', scopeLabel()), document.createTextNode(t('filled_forms', { n: fi(S.preenchidas) })));
    drawFilters();
    drawKpis(S, G, filt);
    drawTake(S, filt);
    drawItens(S, G, filt, rows);
    drawDims(S, G, filt, rows);
    drawRadar(S, G, filt, rows);
    drawConh(S, rows);
    drawPrioridade(S, rows);
    drawFunil(G, scopeSiglas, filt);
    drawTurmas(rows);
    drawHeat(GR, G, lvl);
    drawRanking(GR, lvl);
    drawParticipacao(GR, lvl);
    drawQualidade();
    drawExec(S, G, filt, scopeSiglas, GR);
    paintPreview();
    drawDados();
    firstDraw = false;
  });
})();

</script>
